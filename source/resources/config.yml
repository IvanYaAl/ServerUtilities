    REDSTONE: 1
    QUARTZ: 2
    AMETHYST_SHARD: 1
    WHEAT: 1
    CARROT: 1
    POTATO: 1
    BEETROOT: 1
    PUMPKIN: 2
    MELON_SLICE: 1
    SUGAR_CANE: 1
    LEATHER: 2
