    BLAZE_ROD: 5
    GHAST_TEAR: 8
    COAL: 1
    CHARCOAL: 1
    RAW_IRON: 2
    IRON_INGOT: 3
    RAW_COPPER: 1
    COPPER_INGOT: 1
    RAW_GOLD: 3
    GOLD_INGOT: 4
    DIAMOND: 15
